<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر إلكتروني - Mini Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; padding: 20px; }
        header { text-align: center; padding: 30px 0; background: #2563eb; color: white; border-radius: 12px; margin-bottom: 30px; }
        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card h3 { font-size: 18px; margin: 15px 0 10px; }
        .card p { color: #2563eb; font-weight: bold; font-size: 20px; margin-bottom: 15px; }
        .btn { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <header>
        <h1>متجر التكنولوجيا الرقمية</h1>
        <p>أحدث المنتجات والحلول البرمجية</p>
    </header>
    <div class="products">
        <div class="card">
            <h3>قالب موقع متعدد الصفحات</h3>
            <p>$49</p>
            <button class="btn">إضافة للسلة</button>
        </div>
        <div class="card">
            <h3>واجهة لوحة تحكم Dashboard</h3>
            <p>$79</p>
            <button class="btn">إضافة للسلة</button>
        </div>
        <div class="card">
            <h3>تطبيق هاتف متجاوب</h3>
            <p>$120</p>
            <button class="btn">إضافة للسلة</button>
        </div>
    </div>
</body>
</html>
